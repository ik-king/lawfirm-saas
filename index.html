<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justitia Law Firm SaaS - اليمن (نسخة مجانية دائمة)</title>
    <!-- استدعاء مكتبة التنسيق لضمان عمل الواجهات والتجاوب مع الجوال -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen pb-10">

    <!-- شاشة الدخول وإنشاء حساب المحامي الجديد -->
    <div id="auth-screen" class="max-w-md mx-auto mt-10 p-6 bg-white rounded-xl shadow-lg border border-gray-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-900">Justitia Pro v4.0 💼</h1>
            <p class="text-emerald-600 text-sm mt-1 font-bold">منصة المحاماة اليمنية الذكية - النسخة المجانية المفتوحة للأبد</p>
        </div>
        <div class="space-y-4">
            <input id="username" type="text" placeholder="اسم المستخدم للمكتب" class="w-full p-3 border rounded-lg text-right focus:outline-blue-900">
            <input id="password" type="password" placeholder="كلمة مرور الحساب" class="w-full p-3 border rounded-lg text-right focus:outline-blue-900">
            <button onclick="handleAuth('login')" class="w-full bg-blue-900 hover:bg-blue-950 text-white p-3 rounded-lg font-bold transition cursor-pointer">تسجيل الدخول</button>
            <button onclick="handleAuth('register')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-3 rounded-lg font-bold transition cursor-pointer">إنشاء حساب جديد للمكتب (مجاناً بالكامل)</button>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية المتجاوبة مع الجوال -->
    <div id="main-app" class="hidden max-w-xl mx-auto px-4 mt-6">
        
        <!-- محتوى التطبيق الفعلي للمحامين -->
        <div id="app-content" class="space-y-6 opacity-100">
            <div class="flex justify-between items-center bg-blue-900 text-white p-4 rounded-xl shadow-md">
                <span id="welcome-msg" class="font-bold text-sm">مكتب المحاماة الرقمي ⚖️</span>
                <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-1 rounded transition cursor-pointer">خروج</button>
            </div>

            <!-- نموذج إضافة ملف قضية -->
            <div class="bg-white p-5 rounded-xl shadow border space-y-3 text-right">
                <h3 class="font-bold text-blue-900 border-b pb-2">➕ تسجيل موكل وقضية جديدة</h3>
                <input id="c-name" type="text" placeholder="اسم الموكل كاملاً" class="w-full p-2 border rounded-lg text-sm">
                <input id="c-phone" type="text" placeholder="رقم هاتف الموكل" class="w-full p-2 border rounded-lg text-sm">
                <input id="c-id" type="text" placeholder="رقم الهوية الوطنية / جواز السفر" class="w-full p-2 border rounded-lg text-sm">
                <textarea id="c-case" placeholder="تفاصيل ومعطيات النزاع القانوني..." class="w-full p-2 border rounded-lg h-20 text-sm"></textarea>
                <div class="grid grid-cols-3 gap-2">
                    <input id="c-date" type="text" placeholder="تاريخ الجلسة القادمة" class="p-2 border rounded-lg text-xs">
                    <input id="c-total" type="number" placeholder="إجمالي الأتعاب" class="p-2 border rounded-lg text-xs">
                    <input id="c-paid" type="number" placeholder="المبلغ المقدم" class="p-2 border rounded-lg text-xs">
                </div>
                <button onclick="addNewClient()" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold p-2.5 rounded-lg text-sm transition cursor-pointer">حفظ السجل الشامل للموكل وتصنيف الملف</button>
            </div>

            <!-- أرشيف وجداول المكتب المالي والقانوني -->
            <div class="bg-white p-5 rounded-xl shadow border text-right">
                <h3 class="font-bold text-blue-900 mb-3 border-b pb-2">📁 أرشيف القضايا والحسابات والذمم المالية</h3>
                <div id="clients-list" class="space-y-3">
                    <!-- تعبئة السجلات آلياً من السيرفر -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ملاحظة: عند رفع الباك إند على استضافة أونلاين، استبدل الرابط المحلي بالرابط الجديد الخاص بالسيرفر.
        const API_URL = "http://127.0.0.1:8000";

        // التحقق من الجلسة المفتوحة مسبقاً
        let currentLawyerId = localStorage.getItem("lawyer_id");
        let loggedInUser = localStorage.getItem("current_user");

        if (currentLawyerId && loggedInUser) {
            showApp();
            fetchClientsArchive();
        }

        // دالة تسجيل الدخول وإنشاء الحساب النظيفة
        async function handleAuth(type) {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            if(!user || !pass) return alert("فضلاً املأ كافة الحقول!");

            const endpoint = type === 'register' ? '/api/register' : '/api/login';

            try {
                const response = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await response.json();

                if (!response.ok) {
                    return alert(data.detail || "حدث خطأ في النظام!");
                }

                if (type === 'register') {
                    alert(data.message);
                }
                
                localStorage.setItem("lawyer_id", data.lawyer_id);
                localStorage.setItem("current_user", user);
                currentLawyerId = data.lawyer_id;
                loggedInUser = user;

                showApp();
                fetchClientsArchive();

            } catch (error) {
                console.error("Error:", error);
                alert("تعذر الاتصال بالسيرفر! تأكد من تشغيل الباك-إند.");
            }
        }

        // دالة جلب أرشيف القضايا من قاعدة البيانات الثابتة
        async function fetchClientsArchive() {
            if (!currentLawyerId) return;

            try {
                const response = await fetch(`${API_URL}/api/clients/${currentLawyerId}`);
                const data = await response.json();

                const listContainer = document.getElementById("clients-list");
                listContainer.innerHTML = "";

                if (!data.clients || data.clients.length === 0) {
                    listContainer.innerHTML = `<p class="text-gray-400 text-center text-sm py-4">لا توجد قضايا مسجلة في الأرشيف حالياً.</p>`;
                    return;
                }

                data.clients.forEach(client => {
                    const clientBox = document.createElement("div");
                    clientBox.className = "p-3 border rounded-lg bg-gray-50 space-y-1 text-sm";
                    clientBox.innerHTML = `
                        <div class="flex justify-between font-bold text-gray-800">
                            <span>👤 ${client.name}</span>
                            <span class="text-xs text-blue-800 bg-blue-50 px-2 py-0.5 rounded">📆 جلسة: ${client.session_date}</span>
                        </div>
                        <p class="text-gray-600 text-xs mt-1">📞 الهاتف: ${client.phone} | 🪪 الهوية: ${client.id_num}</p>
                        <p class="text-gray-700 bg-white p-2 rounded border border-gray-100 my-1 text-xs">${client.case_text}</p>
                        <div class="grid grid-cols-3 gap-1 text-center text-xs pt-1 border-t border-gray-200 mt-2 text-gray-600">
                            <div>الأتعاب: <b class="text-blue-900">${client.total_fees}</b></div>
                            <div>المدفوع: <b class="text-emerald-700">${client.paid_amount}</b></div>
                            <div>المتبقي: <b class="text-red-600">${client.remaining_amount}</b></div>
                        </div>
                    `;
                    listContainer.appendChild(clientBox);
                });

            } catch (error) {
                console.error("Error fetching clients:", error);
            }
        }

        // دالة إضافة وحفظ موكل جديد بشكل دائم
        async function addNewClient() {
            if (!currentLawyerId) return alert("انتهت الجلسة، يرجى تسجيل الدخول مجدداً.");

            const name = document.getElementById("c-name").value.trim();
            const phone = document.getElementById("c-phone").value.trim();
            const id_num = document.getElementById("c-id").value.trim();
            const case_text = document.getElementById("c-case").value.trim();
            const session_date = document.getElementById("c-date").value.trim();
            const total_fees = parseFloat(document.getElementById("c-total").value) || 0;
            const paid_amount = parseFloat(document.getElementById("c-paid").value) || 0;

            if(!name || !phone || !case_text) return alert("فضلاً املأ الاسم، الهاتف، وتفاصيل القضية!");

            const payload = {
                lawyer_id: parseInt(currentLawyerId),
                name, phone, id_num, case_text, session_date, total_fees, paid_amount
            };

            try {
                const response = await fetch(`${API_URL}/api/add-client`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                alert(data.message);
                
                // تفريغ المدخلات بعد الحفظ
                document.getElementById("c-name").value = "";
                document.getElementById("c-phone").value = "";
                document.getElementById("c-id").value = "";
                document.getElementById("c-case").value = "";
                document.getElementById("c-date").value = "";
